workflows:
  ios-workflow:
    name: Deli Cocktail House iOS (unsigned)
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Create .env
        script: |
          cd apps/employee_mobile
          # .env is gitignored; recreate it here. Override API_BASE_URL by
          # adding it as a Codemagic environment variable if the URL changes.
          echo "API_BASE_URL=${API_BASE_URL:-https://api.delicocktailhouse.in}" > .env
          cat .env

      - name: Get Flutter dependencies
        script: |
          cd apps/employee_mobile
          flutter pub get

      - name: Prepare iOS project
        script: |
          cd apps/employee_mobile
          # Generates Podfile / Generated.xcconfig, bumps deployment target,
          # runs pod install and SPM integration. Fails at the final signing
          # check on newer Xcode, which is fine - we only need the setup.
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install

      - name: Build unsigned .app with xcodebuild
        script: |
          cd apps/employee_mobile/ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

          APP="build/Build/Products/Release-iphoneos/Runner.app"
          test -d "$APP" || { echo "Build failed: no Runner.app produced"; exit 1; }
          mkdir -p ../build/ios/iphoneos
          cp -R "$APP" ../build/ios/iphoneos/

      - name: Package into IPA
        script: |
          cd apps/employee_mobile/build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

    artifacts:
      - apps/employee_mobile/build/ios/iphoneos/Runner-unsigned.ipa

    publishing:
      email:
        recipients:
          - delicocktailhouse987@gmail.com
