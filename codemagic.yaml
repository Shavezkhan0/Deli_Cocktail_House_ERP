workflows:
  ios-workflow:
    name: Deli Cocktail House iOS
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          cd apps/employee_mobile
          flutter pub get

      - name: Build iOS
        script: |
          cd apps/employee_mobile
          flutter build ios --release --no-codesign

    artifacts:
      - apps/employee_mobile/build/ios/iphoneos/Runner.app

    publishing:
      email:
        recipients:
          - your-email@example.com
