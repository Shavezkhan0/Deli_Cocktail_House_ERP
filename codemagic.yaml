workflows:
  ios-workflow:
    name: Deli Cocktail House iOS (unsigned)
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          cd apps/employee_mobile
          flutter pub get

      - name: Build unsigned .app
        script: |
          cd apps/employee_mobile
          # flutter build runs `pod install` itself with the correct platform
          # and Flutter podspec set up. On newer Xcode it still errors at the
          # final validation step even with --no-codesign, so ignore that exit
          # code; the Runner.app is already produced by then.
          flutter build ios --release --no-codesign || true

          APP_DIR="build/ios/iphoneos"
          test -d "$APP_DIR/Runner.app" || { echo "Build failed: no Runner.app produced"; exit 1; }

      - name: Package into IPA
        script: |
          cd apps/employee_mobile/build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

    artifacts:
      - apps/employee_mobile/build/ios/iphoneos/Runner-unsigned.ipa

    publishing:
      email:
        recipients:
          - delicocktailhouse987@gmail.com
