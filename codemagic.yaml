workflows:
  ios-workflow:
    name: Deli Cocktail House iOS (unsigned)
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter dependencies
        script: |
          cd apps/employee_mobile
          flutter pub get

      - name: Pod install
        script: |
          cd apps/employee_mobile/ios
          pod install

      - name: Build unsigned .app
        script: |
          cd apps/employee_mobile
          # Compile Dart + assets. Newer Xcode still errors at the final
          # validation step even with --no-codesign, so ignore that exit code;
          # the Runner.app is already produced by then.
          flutter build ios --release --no-codesign || true

          # Fallback: if Flutter did not leave a Runner.app, build it directly
          # with xcodebuild and all code signing switched off.
          APP_DIR="build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            echo "Runner.app missing, building with xcodebuild..."
            cd ios
            xcodebuild -workspace Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath ../build/ios_xcodebuild \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              build
            cd ..
            mkdir -p "$APP_DIR"
            cp -R build/ios_xcodebuild/Build/Products/Release-iphoneos/Runner.app "$APP_DIR/"
          fi

          test -d "$APP_DIR/Runner.app" || { echo "Build failed: no Runner.app"; exit 1; }

      - name: Package into IPA
        script: |
          cd apps/employee_mobile/build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
          zip -r Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa

    artifacts:
      - apps/employee_mobile/build/ios/iphoneos/Runner-unsigned.ipa

    publishing:
      email:
        recipients:
          - delicocktailhouse987@gmail.com
